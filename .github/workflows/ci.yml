name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # The job name is the required status check in the `protect-main` ruleset.
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
      DATABASE_URL: postgres://app:app@localhost:5432/app_test
      SESSION_SECRET: ci-only-secret-never-used-in-production
      APP_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Production smoke test
        run: |
          mkdir -p apps/web/dist && [ -f apps/web/dist/index.html ] || echo '<!doctype html><title>smoke</title>' > apps/web/dist/index.html
          NODE_ENV=production PORT=3999 node apps/server/dist/index.js & echo $! > /tmp/srv.pid
          for i in $(seq 1 20); do curl -sf localhost:3999/api/health && break; sleep 0.5; done
          curl -sf localhost:3999/api/health | grep -q '"db":"up"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3999/)" = 200
          curl -s localhost:3999/api/does-not-exist | grep -q '"error"'
          kill "$(cat /tmp/srv.pid)"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/*.png
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
